<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web NFC Diagnostic Reader</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    h1 { font-size: 1.5rem; }
    p { color: var(--text-muted); font-size: 0.95rem; }
    button {
      padding: 0.85rem 1.25rem;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    .uid-display {
      font-family: monospace;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--green);
      word-break: break-all;
      margin: 0.5rem 0;
    }
    .log-box {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.85rem;
      color: #cbd5e1;
      height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .badge-active { background: rgba(34, 197, 94, 0.2); color: var(--green); }
    .badge-inactive { background: rgba(239, 68, 68, 0.2); color: var(--red); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>NFC Diagnostic Tool</h1>
      <p>Scan MIFARE Classic 1K cards to read and verify hardware UIDs.</p>
    </header>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <span>Scanner Status:</span>
        <span id="scanStatus" class="badge badge-inactive">Stopped</span>
      </div>
      <button id="startBtn">Start NFC Scan</button>
    </div>

    <div class="card">
      <div style="font-size: 0.85rem; color: var(--text-muted);">Last Scanned UID:</div>
      <div id="lastUid" class="uid-display">--:--:--:--</div>
      <div id="readDetails" style="font-size: 0.85rem; color: var(--text-muted);">Taps: 0</div>
    </div>

    <div class="card">
      <div style="margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600;">Activity Log:</div>
      <div id="log" class="log-box">Waiting for user gesture to start scan...</div>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const scanStatus = document.getElementById("scanStatus");
    const lastUid = document.getElementById("lastUid");
    const readDetails = document.getElementById("readDetails");
    const logBox = document.getElementById("log");

    let tapCount = 0;
    let ndefReader = null;

    function appendLog(msg) {
      const ts = new Date().toLocaleTimeString();
      logBox.textContent = `[${ts}] ${msg}\n` + logBox.textContent;
    }

    function normalizeUid(rawUid) {
      if (!rawUid) return "";
      return rawUid.trim().toLowerCase();
    }

    startBtn.addEventListener("click", async () => {
      if (!("NDEFReader" in window)) {
        appendLog("ERROR: Web NFC (NDEFReader) is not supported in this browser. Use Chrome on Android over HTTPS.");
        return;
      }

      try {
        ndefReader = new NDEFReader();
        await ndefReader.scan();

        startBtn.disabled = true;
        scanStatus.textContent = "Scanning Active";
        scanStatus.className = "badge badge-active";
        appendLog("NFC scan started successfully. Hold card near phone.");

        ndefReader.addEventListener("reading", (event) => {
          const serial = normalizeUid(event.serialNumber);
          tapCount++;
          lastUid.textContent = serial || "(no serial)";
          readDetails.textContent = `Taps: ${tapCount} | Records: ${event.message ? event.message.records.length : 0}`;
          appendLog(`READ: UID=${serial}`);
        });

        ndefReader.addEventListener("readingerror", () => {
          appendLog("WARN: readingerror occurred (card moved too quickly or unreadable).");
        });

      } catch (err) {
        appendLog(`ERROR starting scan: ${err.message || err}`);
      }
    });
  </script>
</body>
</html>
