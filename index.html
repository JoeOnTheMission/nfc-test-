<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap-to-Attend</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
    }
    header {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding-top: 1rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }
    main {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .status-badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    p {
      color: var(--text-muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    footer {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding: 1rem 0;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tap-to-Attend</h1>
    <p class="subtitle">AASTU Attendance System</p>
  </header>

  <main>
    <div class="status-badge">Step 0: Skeleton Active</div>
    <p>Tap-to-Attend app shell initialized.</p>
    <p style="margin-top: 0.5rem;">Ready for Step 1 backend setup and local reader integration.</p>
  </main>

  <footer>
    <div>Tap-to-Attend &bull; <span id="app-version">v0.1.0</span></div>
  </footer>

  <script>
    // Configuration & App Version
    const APP_VERSION = "0.1.0";
    document.getElementById("app-version").textContent = `v${APP_VERSION}`;
  </script>
</body>
</html>
